<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Ember & Crest</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
<style>
  .auth-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  
  .auth-form-wrap {
    width: 100%;
    max-width: 420px;
    padding: 0 20px;
  }
  
  .auth-card {
    background: linear-gradient(160deg, rgba(38,30,18,.97) 0%, rgba(20,15,8,.98) 100%);
    border: 1px solid rgba(201,168,76,.18);
    border-radius: 28px;
    padding: 48px 32px;
    box-shadow: 0 32px 80px rgba(0,0,0,.75), 0 0 40px rgba(201,168,76,.18);
  }
  
  .auth-header {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .auth-emblem {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  
  .emblem-bar {
    width: 35px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  
  .emblem-bar.right {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  
  .emblem-icon {
    font-size: 1.8rem;
    filter: drop-shadow(0 0 10px rgba(201,168,76,.6));
  }
  
  .auth-header h1 {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 8px;
  }
  
  .auth-header p {
    font-size: .85rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  
  .form-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid rgba(201,168,76,.20);
    border-radius: 12px;
    background: rgba(255,255,255,.04);
    color: var(--cream);
    font-family: var(--font-body);
    font-size: .95rem;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
  }
  
  .form-group input::placeholder {
    color: #5a4e38;
  }
  
  .form-group input:focus {
    border-color: rgba(201,168,76,.55);
    box-shadow: 0 0 0 4px rgba(201,168,76,.08);
  }
  
  .submit-btn {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--ember));
    color: var(--ink);
    font-family: var(--font-body);
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .25s;
    box-shadow: 0 8px 24px rgba(201,168,76,.30);
    margin-top: 8px;
    margin-bottom: 20px;
  }
  
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(201,168,76,.40);
  }
  
  .submit-btn:active {
    transform: translateY(0);
  }
  
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  
  .divider span {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,.20));
  }
  
  .divider span:last-child {
    background: linear-gradient(90deg, rgba(201,168,76,.20), transparent);
  }
  
  .divider i {
    font-style: normal;
    font-size: .75rem;
    color: var(--gold-dim);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  
  .auth-toggle {
    text-align: center;
    font-size: .85rem;
    color: var(--text-body);
  }
  
  .auth-toggle a {
    color: var(--gold-light);
    text-decoration: none;
    transition: color .2s;
    cursor: pointer;
  }
  
  .auth-toggle a:hover {
    color: var(--gold);
  }
  
  .error-msg {
    background: rgba(212, 80, 42, .15);
    border: 1px solid rgba(212, 80, 42, .30);
    color: #ff9999;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: .85rem;
    margin-bottom: 16px;
    display: none;
  }
  
  .error-msg.show {
    display: block;
  }
  
  .success-msg {
    background: rgba(74, 222, 128, .15);
    border: 1px solid rgba(74, 222, 128, .30);
    color: #90ee90;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: .85rem;
    margin-bottom: 16px;
    display: none;
  }
  
  .success-msg.show {
    display: block;
  }
</style>
</head>
<body>

<div class="gfx-bg"></div>
<div class="gfx-lines"></div>
<div class="gfx-orb gfx-orb-1"></div>
<div class="gfx-orb gfx-orb-2"></div>
<div class="gfx-orb gfx-orb-3"></div>

<div class="auth-container">
  <div class="auth-form-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-emblem">
          <div class="emblem-bar"></div>
          <span class="emblem-icon">🕯</span>
          <div class="emblem-bar right"></div>
        </div>
        <h1>Ember & Crest</h1>
        <p>Fine Dining · Est. 1998</p>
      </div>
      
      <div id="login-form-wrapper">
        <h2 style="font-family: var(--font-head); font-size: 1.4rem; color: var(--cream); margin-bottom: 24px; letter-spacing: .06em;">Sign In</h2>
        <div class="error-msg" id="login-error"></div>
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="your@email.com" required/>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="••••••••" required/>
          </div>
          <button type="submit" class="submit-btn">Sign In</button>
        </form>
        
        <div class="divider">
          <span></span>
          <i>or</i>
          <span></span>
        </div>
        
        <div class="auth-toggle">
          Don't have an account? <a onclick="switchToSignup()">Create one</a>
        </div>
      </div>
      
      <div id="signup-form-wrapper" style="display: none;">
        <h2 style="font-family: var(--font-head); font-size: 1.4rem; color: var(--cream); margin-bottom: 24px; letter-spacing: .06em;">Create Account</h2>
        <div class="error-msg" id="signup-error"></div>
        <div class="success-msg" id="signup-success"></div>
        <form id="signup-form" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="name" placeholder="Your Name" required/>
          </div>
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" placeholder="your@email.com" required/>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="••••••••" required/>
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirm" placeholder="••••••••" required/>
          </div>
          <button type="submit" class="submit-btn">Create Account</button>
        </form>
        
        <div class="divider">
          <span></span>
          <i>or</i>
          <span></span>
        </div>
        
        <div class="auth-toggle">
          Already have an account? <a onclick="switchToLogin()">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function switchToLogin() {
  document.getElementById('login-form-wrapper').style.display = 'block';
  document.getElementById('signup-form-wrapper').style.display = 'none';
  document.getElementById('signup-error').classList.remove('show');
  document.getElementById('signup-success').classList.remove('show');
}

function switchToSignup() {
  document.getElementById('login-form-wrapper').style.display = 'none';
  document.getElementById('signup-form-wrapper').style.display = 'block';
  document.getElementById('login-error').classList.remove('show');
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('login-error');
  
  errorDiv.classList.remove('show');
  
  try {
    const response = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      localStorage.setItem('user', JSON.stringify(data.user));
      localStorage.setItem('token', data.token);
      window.location.href = '/';
    } else {
      errorDiv.textContent = data.message || 'Login failed';
      errorDiv.classList.add('show');
    }
  } catch (err) {
    errorDiv.textContent = 'Network error. Please try again.';
    errorDiv.classList.add('show');
  }
}

async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  const errorDiv = document.getElementById('signup-error');
  const successDiv = document.getElementById('signup-success');
  
  errorDiv.classList.remove('show');
  successDiv.classList.remove('show');
  
  if (password !== confirm) {
    errorDiv.textContent = 'Passwords do not match';
    errorDiv.classList.add('show');
    return;
  }
  
  if (password.length < 6) {
    errorDiv.textContent = 'Password must be at least 6 characters';
    errorDiv.classList.add('show');
    return;
  }
  
  try {
    const response = await fetch('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      successDiv.textContent = 'Account created! Redirecting to login...';
      successDiv.classList.add('show');
      document.getElementById('signup-form').reset();
      setTimeout(() => {
        switchToLogin();
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').focus();
      }, 1500);
    } else {
      errorDiv.textContent = data.message || 'Signup failed';
      errorDiv.classList.add('show');
    }
  } catch (err) {
    errorDiv.textContent = 'Network error. Please try again.';
    errorDiv.classList.add('show');
  }
}
</script>

</body>
</html>
